<!DOCTYPE html>
<html>
<head>
    <title>Add Product - StockFlow</title>
</head>
<body>

    <h1>Add New Product</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Product Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>SKU:</label><br>
        <input type="text" name="sku" required><br><br>

        <label>Description:</label><br>
        <textarea name="description"></textarea><br><br>

        <label>Quantity:</label><br>
        <input type="number" name="quantity" min="0" value="0" required><br><br>

        <label>Cost Price:</label><br>
        <input type="number" name="cost_price" min="0" step="0.01"><br><br>

        <label>Selling Price:</label><br>
        <input type="number" name="selling_price" min="0" step="0.01"><br><br>

        <label>Low Stock Threshold:</label><br>
        <input type="number" name="low_stock_threshold" min="0"><br><br>

        <button type="submit">Add Product</button>

    </form>

    <br>
    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
