
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-warning">
            <h3 class="mb-0">Edit Product</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ product.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">SKU</label>
                    <input type="text" name="sku" class="form-control"
                           value="{{ product.sku }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control"
                              rows="3">{{ product.description or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" class="form-control"
                           value="{{ product.quantity }}" min="0" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cost Price (₹)</label>
                    <input type="number" name="cost_price" class="form-control"
                           value="{{ product.cost_price if product.cost_price is not none else '' }}"
                           min="0" step="0.01">
                </div>

                <div class="mb-3">
                    <label class="form-label">Selling Price (₹)</label>
                    <input type="number" name="selling_price" class="form-control"
                           value="{{ product.selling_price if product.selling_price is not none else '' }}"
                           min="0" step="0.01">
                </div>

                <div class="mb-3">
                    <label class="form-label">Low Stock Threshold</label>
                    <input type="number" name="low_stock_threshold" class="form-control"
                           value="{{ product.low_stock_threshold if product.low_stock_threshold is not none else '' }}"
                           min="0">
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Product
                </button>

                <a href="{{ url_for('products_page') }}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
